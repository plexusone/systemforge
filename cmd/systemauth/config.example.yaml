# SystemAuth Configuration Example
# Copy this file to config.yaml and customize for your environment.

# The issuer URL is the base URL of your OAuth server.
# This URL will appear in tokens and discovery documents.
issuer: https://auth.example.com

# Token lifetimes (optional - defaults shown)
tokens:
  access_token_lifetime: 10m     # How long access tokens are valid (default 10m, at most 15m)
  refresh_token_lifetime: 168h   # How long each refresh token is valid (7 days)
  refresh_token_absolute_lifetime: 720h  # Max lifetime of a rotating refresh-token family (30 days)
  id_token_lifetime: 1h          # How long ID tokens are valid
  auth_code_lifetime: 10m        # How long authorization codes are valid
  # Signs codes, refresh tokens and opaque access tokens: 32+ bytes, the same
  # on every instance (openssl rand -hex 32). Required outside --dev.
  hmac_secret: ${SYSTEMAUTH_TOKEN_HMAC_SECRET}
  # hmac_verification_secret: ${SYSTEMAUTH_TOKEN_HMAC_VERIFICATION_SECRET}   # during a rotation

# DPoP replay cache. Outside --dev the server needs a cache every instance
# shares, or the statement that one instance serves SystemAuth.
dpop:
  single_instance: true
  # replay_cache_redis_url: ${SYSTEMAUTH_DPOP_REDIS_URL}   # with several instances

# Production checks to waive by name; each is logged as a warning at start.
# production:
#   allow:
#     - ephemeral_hmac_secret             # start without tokens.hmac_secret
#     - client_secret_client_credentials  # serve client_credentials with a shared secret
#     - bearer_token_clients              # serve clients with allow_bearer_tokens

# Key configuration
# Production requires a signing key (or --signing-key-file / SYSTEMAUTH_SIGNING_KEY);
# without one an ephemeral key is generated and --dev is required.
keys:
  algorithm: RS256               # JWT signing algorithm (RS256)
  # key_id: prod-1               # JWKS kid (default: RFC 7638 thumbprint of the key)
  # private_key_file: ${SYSTEMAUTH_SIGNING_KEY_FILE}   # PEM RSA key, >= 2048 bits
  # private_key_pem: ${SYSTEMAUTH_SIGNING_KEY}         # or the PEM content itself

# Feature flags (optional)
features:
  require_pkce: true                    # Require PKCE for authorization code flows
  allow_dynamic_registration: false     # Enable RFC 7591 dynamic client registration
  enable_device_flow: false             # Enable device authorization grant (RFC 8628)
  enable_jwt_access_tokens: false       # Issue RS256 JWT access tokens (verifiable via JWKS) instead of opaque tokens

# Static client configurations
# Define OAuth clients that can authenticate with this server.
clients:
  # Example: Public SPA client (PKCE required, no secret)
  - id: spa-app
    type: public
    name: My SPA Application
    description: Single-page application with PKCE
    # Who owns the app: first_party (default for clients in this file; no
    # consent screen), second_party (the customer) or third_party (a
    # partner); the last two ask users for consent and record it.
    party: first_party
    # logo_url: https://myapp.example.com/logo.png   # shown on the login page
    redirect_uris:
      - https://myapp.example.com/callback
      - http://localhost:3000/callback  # Development
    grant_types:
      - authorization_code
      - refresh_token
    response_types:
      - code
    scopes:
      - openid
      - profile
      - email

  # Example: Confidential server-side web application. Outside --dev the
  # client_credentials grant with a shared secret is refused; automation
  # uses service accounts with the JWT-bearer grant (oauth.jwt_bearer).
  - id: web-app
    type: confidential
    name: Web Application
    secret: ${WEB_APP_CLIENT_SECRET}    # Uses environment variable
    redirect_uris:
      - https://app.example.com/bff/auth/callback
    grant_types:
      - authorization_code
      - refresh_token
    scopes:
      - openid
      - profile
      - email
      - offline_access

# Social login (optional)
# Lets users sign in to SystemAuth with GitHub and/or Google. Upstream OAuth
# credentials live only here; relying-party apps federate to SystemAuth.
# Register the callback URL {issuer}/login/{provider}/callback with each provider.
# social_login:
#   github:
#     client_id: ${GITHUB_CLIENT_ID}
#     client_secret: ${GITHUB_CLIENT_SECRET}
#   google:
#     client_id: ${GOOGLE_CLIENT_ID}
#     client_secret: ${GOOGLE_CLIENT_SECRET}
#   # Absolute origins allowed as post-login return_to targets (the issuer's
#   # own origin and relative paths are always allowed).
#   allowed_redirect_origins:
#     - https://myapp.example.com
#   default_redirect: /
#   session_lifetime: 12h
#   signup_minimum_age: 0    # ask birth month and year before creating an account; 0 asks nothing
#   insecure_cookies: false  # true only for local development over plain HTTP

# Database configuration (optional - uses in-memory storage if not specified)
# Uncomment and configure for persistent storage.

# SQLite example (good for development):
# database:
#   driver: sqlite
#   dsn: file:systemauth.db?cache=shared&_fk=1

# PostgreSQL example:
# database:
#   driver: postgres
#   dsn: ${DATABASE_URL}  # e.g., postgres://user:pass@localhost:5432/systemauth?sslmode=disable

# Federation configuration (optional)
# Uncomment to integrate with SystemAuth SSO.
# federation:
#   enabled: true
#   systemauth_url: https://systemauth.example.com
#   app_id: my-application
#   client_id: ${SYSTEMAUTH_CLIENT_ID}
#   client_secret: ${SYSTEMAUTH_CLIENT_SECRET}

# Connections to external services (optional, ADR-017). Organizations connect
# accounts at services such as a CDN or analytics product; credentials are
# sealed under keys kept in keys_dir. Needs a database and authz mode rbac.
# The API is served at /api/v1/organizations/{org}/connections and needs the
# systemforge:connections:read or systemforge:connections:write scope.
# connections:
#   keys_dir: /var/lib/systemauth/keys   # back this up with the database
#   vault: env://                        # omnivault URI: env://, file:///etc/systemauth/secrets, ...
#   root_key: SYSTEMAUTH_KEYS_ROOT       # path in the vault; 32 bytes, e.g. openssl rand -base64 32
#   egress_allow_prefixes: []            # development only: e.g. [127.0.0.0/8] to reach local fake providers
#   allow_http_egress: false             # development only: reach local fake providers over plain HTTP

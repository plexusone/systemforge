    CreateOrganizationRequest:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: '^[a-z][a-z0-9-]*[a-z0-9]$'
        org_type:
          type: string
          enum: [personal, team, enterprise]
          default: team
        logo_url:
          type: string
        description:
          type: string
        website_url:
          type: string
        plan:
          type: string
          enum: [free, starter, pro, enterprise]
          default: free
        settings:
          type: object

